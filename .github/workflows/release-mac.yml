name: macOS Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true

jobs:
  build-dmg:
    name: Build & package macOS DMG
    runs-on: macos-14   # Apple Silicon runner — required for Mac Catalyst

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Write Secrets.xcconfig
        env:
          VAULTE_RELAY_BASE_URL: ${{ secrets.VAULTE_RELAY_BASE_URL }}
          VAULTE_RELAY_API_KEY: ${{ secrets.VAULTE_RELAY_API_KEY }}
          VAULTE_RELAY_HMAC_SECRET: ${{ secrets.VAULTE_RELAY_HMAC_SECRET }}
          VAULTE_RELAY_USERNAME_LOOKUP_PEPPER: ${{ secrets.VAULTE_RELAY_USERNAME_LOOKUP_PEPPER }}
          VAULTE_PINNED_KEY_HASHES: ${{ secrets.VAULTE_PINNED_KEY_HASHES }}
        run: |
          cat > "Secrets.xcconfig" << EOF
          VAULTE_RELAY_BASE_URL = $VAULTE_RELAY_BASE_URL
          VAULTE_RELAY_API_KEY = $VAULTE_RELAY_API_KEY
          VAULTE_RELAY_HMAC_SECRET = $VAULTE_RELAY_HMAC_SECRET
          VAULTE_RELAY_USERNAME_LOOKUP_PEPPER = $VAULTE_RELAY_USERNAME_LOOKUP_PEPPER
          VAULTE_PINNED_KEY_HASHES = $VAULTE_PINNED_KEY_HASHES
          EOF

      - name: Archive (Mac Catalyst)
        run: |
          xcodebuild archive \
            -project "Vaulté Privé/Vaulté Privé.xcodeproj" \
            -scheme "Vaulté Privé" \
            -configuration Release \
            -destination "generic/platform=macOS,variant=Mac Catalyst" \
            -archivePath "$RUNNER_TEMP/VaultePrivé.xcarchive" \
            SKIP_INSTALL=NO \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}

      - name: Export
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/VaultePrivé.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/export/Vaulté Privé.app" \
            "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/export/Vaulté Privé.app"

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Vaulté Privé" \
            --window-pos 200 120 \
            --window-size 540 380 \
            --icon-size 100 \
            --icon "Vaulté Privé.app" 130 190 \
            --hide-extension "Vaulté Privé.app" \
            --app-drop-link 410 190 \
            "$RUNNER_TEMP/VaultePrivé-mac.dmg" \
            "$RUNNER_TEMP/export/"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultePrivé-mac-dmg
          path: ${{ runner.temp }}/VaultePrivé-mac.dmg
          retention-days: 30

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/VaultePrivé-mac.dmg
          name: Vaulté Privé ${{ github.ref_name }}
          body: |
            ## Vaulté Privé ${{ github.ref_name }}

            ### macOS
            Download **VaultePrivé-mac.dmg**, open it, and drag Vaulté Privé to Applications.

            Requires macOS 14.0 or later (Apple Silicon or Intel).

            ### Changelog
            See [OPEN_SOURCE_AUDIT.md](https://github.com/MrVaulte/VaultePriveApp/blob/main/OPEN_SOURCE_AUDIT.md).
